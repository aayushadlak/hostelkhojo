# Netlify Configuration File for Hostel Khojo
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

# API Proxy Redirect (Uncomment and replace with your backend host URL when deployed on Render/Railway/Fly.io)
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-fastapi-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# Single Page Application SPA Redirect Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
