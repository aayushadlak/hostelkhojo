# Netlify Configuration File for Hostel Khojo
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

# API Proxy Redirect to Render Backend
[[redirects]]
  from = "/api/*"
  to = "https://hostelkhojo.onrender.com/api/:splat"
  status = 200
  force = true


# Single Page Application SPA Redirect Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
