<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <!-- Group for Logo Icon -->
  <g transform="translate(10, -10) scale(0.52)">
    <!-- Location Pin / Shield Marker (Dark Navy Blue) -->
    <path d="M 256 120 
             C 165 120, 142 205, 142 255 
             C 142 335, 256 445, 256 445 
             C 256 445, 370 335, 370 255 
             C 370 205, 347 120, 256 120 Z" 
          fill="#1C325B" />

    <!-- Inner Pure White Circular Container -->
    <circle cx="256" cy="235" r="88" fill="#FFFFFF" />

    <!-- Orange Window/Door Icon inside circle -->
    <path d="M 226 215 
             A 30 30 0 0 1 286 215 
             L 226 215 Z" 
          fill="#F99631" />
    
    <rect x="226" y="222" width="26" height="34" rx="3" fill="#F99631" />
    <rect x="260" y="222" width="26" height="34" rx="3" fill="#F99631" />

    <!-- Chimney on Right Side of Roof -->
    <path d="M 336 170 
             L 336 120 
             C 336 116, 340 112, 345 112 
             L 365 112 
             C 370 112, 374 116, 374 120 
             L 374 205 Z" 
          fill="#F99631" />

    <!-- Roof Outer White Stroke -->
    <path d="M 132 265 
             L 256 150 
             L 380 265" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Roof Orange Main Chevron -->
    <path d="M 132 265 
             L 256 150 
             L 380 265" 
          fill="none" 
          stroke="#F99631" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Typography: Hostel Khojo -->
  <text x="270" y="142" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="70" font-weight="800" letter-spacing="-1">
    <tspan fill="#1C325B">Hostel </tspan>
    <tspan fill="#F99631">Khojo</tspan>
  </text>
  
  <text x="274" y="180" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#777587" letter-spacing="3.5">
    VERIFIED STUDENT HOUSING
  </text>
</svg>
